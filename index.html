<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dünya'nın Doğuşu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed space canvas; header top-left, chapter panel on the right, timeline dock across the bottom.
   One deliberate dark look (deep space). The accent follows the era: dust violet → magma → ocean → life. */
:root {
  --void: #04060c;
  --ink: #e7eaf3;
  --ink-2: #99a2b8;
  --line: rgba(150, 165, 205, 0.2);
  --panel: rgba(7, 10, 19, 0.66);
  --era: #b9a6ff;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--void);
  color: var(--ink);
  font: 400 14px/1.55 var(--f-body);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
#sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

.app {
  position: relative;
  box-sizing: border-box;
  height: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 330px;
  grid-template-rows: auto minmax(0, 1fr) auto;
  column-gap: 28px;
  row-gap: 12px;
  padding-inline: 28px;
  padding-block: 22px 18px;
  pointer-events: none;
}
.head, .panel, .dock { pointer-events: auto; }

.head { grid-column: 1; grid-row: 1; min-width: 0; }
.eyebrow {
  margin: 0 0 6px;
  font: 500 11px/1.3 var(--f-mono);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-2);
}
.eyebrow b { color: var(--era); font-weight: 500; transition: color .8s; }
h1 {
  margin: 0;
  font: 750 clamp(30px, 5.2vw, 60px)/0.98 var(--f-display);
  font-variation-settings: "opsz" 96;
  letter-spacing: -0.02em;
  text-wrap: balance;
}
.age {
  margin: 10px 0 0;
  display: flex; align-items: baseline; flex-wrap: wrap; gap: 0 10px;
  font-family: var(--f-mono);
  font-variant-numeric: tabular-nums;
}
.age #ageNum { font-size: clamp(20px, 2.6vw, 28px); font-weight: 500; color: var(--era); transition: color .8s; }
.age #ageUnit { font-size: 13px; color: var(--ink-2); }
.since { margin: 2px 0 0; font: 400 12px/1.4 var(--f-mono); color: var(--ink-2); font-variant-numeric: tabular-nums; }

#stage { grid-column: 1; grid-row: 2; position: relative; min-height: 0; }
.toast {
  position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%);
  max-width: min(460px, 100%);
  box-sizing: border-box;
  padding: 8px 14px;
  border-radius: 999px;
  background: var(--panel);
  border: 1px solid var(--line);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  font: 500 13px/1.35 var(--f-body);
  text-align: center;
  animation: toastIn .45s ease-out;
}
.toast i { font-style: normal; font-family: var(--f-mono); color: var(--era); margin-right: 6px; }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 8px); } }

.panel {
  grid-column: 2; grid-row: 1 / span 2; align-self: start;
  min-width: 0;
  display: grid; gap: 14px;
  padding: 18px 18px 16px;
  border-radius: 14px;
  background: var(--panel);
  border: 1px solid var(--line);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.chapter {
  margin: 0;
  display: flex; justify-content: space-between; gap: 8px;
  font: 500 11px/1.3 var(--f-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-2);
}
.chapter span:last-child { color: var(--era); transition: color .8s; }
.desc { margin: 0; font-size: 14px; line-height: 1.6; color: var(--ink); max-width: 62ch; }
.more {
  display: none; justify-self: start;
  padding: 0; border: 0; background: none; color: var(--era);
  font: 500 12px/1.4 var(--f-body); cursor: pointer;
}
.readouts {
  margin: 0;
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: 10px; overflow: hidden;
}
.readouts > div { background: var(--void); padding: 8px 10px; min-width: 0; }
.readouts .wide { grid-column: 1 / -1; }
.readouts dt { font: 500 10px/1.3 var(--f-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2); }
.readouts dd { margin: 3px 0 0; font: 500 15px/1.3 var(--f-mono); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

.dock {
  grid-column: 1 / -1; grid-row: 3;
  display: flex; align-items: center; gap: 14px;
}
.btn {
  flex: none;
  width: 42px; height: 42px;
  display: grid; place-items: center;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--ink);
  cursor: pointer;
  transition: border-color .2s, background .2s;
}
.btn:hover { border-color: var(--era); }
.btn.primary { background: var(--era); color: var(--void); border-color: transparent; }
.btn svg { width: 18px; height: 18px; fill: currentColor; }
.btn:focus-visible, .timeline:focus-visible, .speed button:focus-visible, .more:focus-visible {
  outline: 2px solid var(--era); outline-offset: 3px;
}
.timeline {
  position: relative; flex: 1 1 auto; min-width: 0;
  height: 46px;
  cursor: pointer;
  touch-action: none;
  border-radius: 8px;
}
.segs { position: absolute; left: 0; right: 0; top: 14px; display: flex; gap: 3px; }
.seg { position: relative; min-width: 0; }
.seg .bar { height: 6px; border-radius: 3px; background: rgba(150, 165, 205, 0.22); overflow: hidden; }
.seg .fill { height: 100%; width: 0; background: var(--era); transition: background .8s; }
.seg .lbl {
  display: block; margin-top: 7px;
  font: 500 10px/1.2 var(--f-mono); letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--ink-2);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.seg.on .lbl { color: var(--ink); }
.marks { position: absolute; left: 0; right: 0; top: 4px; height: 6px; }
.mark { position: absolute; top: 0; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--ink-2); opacity: .7; }
.mark.past { background: var(--era); opacity: 1; }
.playhead {
  position: absolute; top: 8px; width: 2px; height: 18px; margin-left: -1px;
  background: var(--ink); border-radius: 1px;
  box-shadow: 0 0 10px var(--era);
}
.speed { flex: none; display: flex; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); padding: 3px; }
.speed button {
  border: 0; background: none; color: var(--ink-2);
  font: 500 12px/1 var(--f-mono);
  padding: 8px 9px; border-radius: 999px; cursor: pointer;
}
.speed button[aria-pressed="true"] { background: rgba(150, 165, 205, 0.18); color: var(--ink); }

@media (max-width: 860px) {
  .app {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(200px, 1fr) auto auto;
    padding-inline: 16px;
    padding-block: 14px 12px;
    row-gap: 10px;
  }
  .panel { grid-column: 1; grid-row: 3; padding: 12px 14px; gap: 10px; }
  .dock { grid-row: 4; flex-wrap: wrap; gap: 10px; }
  .timeline { order: -1; flex-basis: 100%; }
  .speed { margin-left: auto; }
  .desc { font-size: 13px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .desc.open { display: block; }
  .more { display: inline; }
  .readouts { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .readouts .wide { grid-column: span 2; }
  .readouts dd { font-size: 13px; }
  .seg .lbl { visibility: hidden; }
  .seg.on .lbl { visibility: visible; overflow: visible; }
}
@media (max-width: 860px) and (max-height: 700px) {
  .since { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .toast { animation: none; }
}
</style>
</head>

</div>

      g2.addColorStop(1, 'rgba(255,200,150,0)');
      ctx.fillStyle = g2;
      ctx.beginPath(); ctx.arc(sx, sy, S * 0.9, 0, TAU); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }
  }

  // frost line and scale bar
  const guideA = (i === 0 ? sstep(0.7, 1, u) : 1) * (1 - sstep(0, 0.12, zoom));
  if (guideA > 0.01) {
    ctx.save();
    ctx.globalAlpha = alpha * guideA * 0.8;
    ctx.setLineDash([4, 6]);
    ctx.strokeStyle = 'rgba(160,200,255,0.8)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.ellipse(px(0, 0, 0), py(0, 0, 0), 0.9 * S, 0.9 * S * SP, 0, 0, TAU);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(190,214,255,0.95)';
    ctx.font = '500 11px "IBM Plex Mono", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('KAR ÇİZGİSİ · 2,7 AU', px(0, 0, 0), py(0, 0, 0) + 0.9 * S * SP + 16);
    // scale bar: disk radius 1 = 3 AU
    const bx = cx - vw / 2 + 6, by = cy + vh / 2 - 10, bl = S / 3;
    ctx.strokeStyle = 'rgba(220,226,240,0.8)';
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + bl, by);
    ctx.moveTo(bx, by - 4); ctx.lineTo(bx, by + 4); ctx.moveTo(bx + bl, by - 4); ctx.lineTo(bx + bl, by + 4); ctx.stroke();
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(220,226,240,0.85)';
    ctx.fillText('1 AU', bx, by - 8);
    ctx.restore();
  }

  // planetesimals
  if (i >= 1) {
    const bA = i === 1 ? sstep(0.02, 0.3, u) : 1;
    ctx.globalAlpha = alpha * bA;
    const grow = 1 + zoom * 7;
    for (const p of NB.b) {
      const x = px(p.x, 0, p.y), y = py(p.x, 0, p.y);
      const rad = (0.9 + 1.2 * Math.cbrt(p.m)) * grow;
      if (x < -50 || x > W + 50 || y < -50 || y > H + 50) continue;
      if (NB.t - p.fl < 0.12) {
        ctx.fillStyle = 'rgba(255,200,120,0.5)';
        ctx.beginPath(); ctx.arc(x, y, rad * 3, 0, TAU); ctx.fill();
      }
      ctx.fillStyle = p.earth ? '#ffb27a' : p.icy ? '#bcd3ff' : '#c9a383';
      ctx.beginPath(); ctx.arc(x, y, rad, 0, TAU); ctx.fill();
    }
    if (e && zoom < 0.5) {
      const x = px(e.x, 0, e.y), y = py(e.x, 0, e.y);
      const la = (1 - zoom * 2) * bA;
      ctx.globalAlpha = alpha * la;
      ctx.strokeStyle = 'rgba(255,178,122,0.9)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(x, y, 9 + Math.cbrt(e.m) * 1.5, 0, TAU); ctx.stroke();
      ctx.fillStyle = 'rgba(255,214,186,0.95)';
      ctx.font = '500 11px "IBM Plex Mono", monospace';
      ctx.textAlign = 'left';
      ctx.fillText('ÖN-DÜNYA', x + 14 + Math.cbrt(e.m) * 1.5, y + 4);
    }
  }
  ctx.restore();
}

/* ================================================================ planet renderer */
function renderPlanet(P) {
  const g = GEO, d = PIMG.data, n = g.n;
  const spinI = (P.spin / TAU) * TW, cspinI = (P.cspin / TAU) * CW;
  const sea = P.sea, landDen = 1 / Math.max(0.03, 1 - sea), seaDen = 1 / Math.max(0.03, sea);
  const mg = P.magma, th = 1 - mg, glow = P.glow, flick = P.flick;
  const veg = P.veg, mature = P.mature, mic = P.microbe, snow = P.snowball, cap = P.cap;
  const cov = Math.max(P.cloud, P.steam), steam = P.steam, haze = P.haze, lights = P.lights;
  const cr = lerp(242, 214, steam), cg = lerp(244, 190, steam), cb = lerp(248, 160, steam);
  const ar = P.ac[0], ag = P.ac[1], ab = P.ac[2], as = P.atmoStr;
  const rb = lerp(58, 130, mature), gb = lerp(51, 110, mature), bb = lerp(48, 86, mature);
  for (let k = 0; k < n; k++) {
    let u = g.lon[k] - spinI; u -= Math.floor(u / TW) * TW;
    const row = g.row[k], ti = row * TW + (u | 0);
    // bilinear elevation keeps coastlines smooth at large sizes
    const rf = g.rowf[k], r0 = rf | 0, fy = rf - r0, u0 = u | 0, fx = u - u0, u1 = u0 + 1 === TW ? 0 : u0 + 1;
    const o0 = r0 * TW, o1 = o0 + TW;
    const h = (HT[o0 + u0] * (1 - fx) + HT[o0 + u1] * fx) * (1 - fy) + (HT[o1 + u0] * (1 - fx) + HT[o1 + u1] * fx) * fy;
    const q = RT[ti], L = g.lit[k];
    let r, gg, b, wet = false;
    if (h < sea) {
      wet = true;
      const t = Math.min(1, (sea - h) * seaDen * 1.8);
      r = lerp(36, 6, t); gg = lerp(122, 32, t); b = lerp(150, 80, t);
      if (mic > 0) { const m = mic * 0.4; r = lerp(r, 34, m); gg = lerp(gg, 116, m); b = lerp(b, 88, m); }
    } else {
      const e = (h - sea) * landDen;
      r = rb + e * 32; gg = gb + e * 26; b = bb + e * 22;
      if (veg > 0) {
        const v = veg * Math.max(0, 1 - e * 1.7) * (1 - g.desert[row]);
        r = lerp(r, 48, v); gg = lerp(gg, 98, v); b = lerp(b, 44, v);
      }
      if (e > 0.86 && mature > 0.3) { const s = Math.min(1, (e - 0.86) * 7); r = lerp(r, 236, s); gg = lerp(gg, 240, s); b = lerp(b, 246, s); }
    }
    let ice = g.alat[row] + (h - 0.5) * 0.25 - cap;
    ice = ice > 0 ? Math.min(1, ice * 12) : 0;
    if (snow > 0) { const si = clamp(snow * 1.3 - (1 - q) * 0.2); if (si > ice) ice = si; }
    if (ice > 0) { r = lerp(r, 226, ice); gg = lerp(gg, 235, ice); b = lerp(b, 244, ice); }
    const lf = 0.03 + 0.97 * L;
    r *= lf; gg *= lf; b *= lf;
    if (wet && ice < 0.5) { const sp = g.spec[k] * (1 - ice * 2) * 0.8; r += sp * 255; gg += sp * 240; b += sp * 215; }
    if (mg > 0) {
      let la = mg >= 0.999 ? 1 : (q - th + 0.08) * 6;
      if (la > 0) {
        if (la > 1) la = 1;
        const heat = (mg >= 0.999 ? 0.5 + 0.5 * q : q) * glow;
        const inten = Math.min(1.25, 0.55 + 0.6 * heat) * (0.92 + 0.08 * flick);
        r = lerp(r, 255 * inten, la);
        gg = lerp(gg, Math.min(255, 40 + 190 * heat * heat) * inten, la);
        b = lerp(b, Math.min(255, 12 + 120 * heat * heat * heat) * inten, la);
      }
    }
    if (lights > 0 && !wet && ice < 0.3 && L < 0.14) {
      const c = (h * 7919) % 1;
      if (c > 0.85 && (h - sea) * landDen < 0.4) {
        const a = lights * (0.14 - L) * 7 * (c - 0.85) * 6.6;
        r += 255 * a; gg += 196 * a; b += 120 * a;
      }
    }
    if (cov > 0) {
      let cu = g.clon[k] - cspinI; cu -= Math.floor(cu / CW) * CW;
      const c0 = cu | 0, cx1 = c0 + 1 === CW ? 0 : c0 + 1, cf = cu - c0;
      const q0 = r0 * CW, q1 = q0 + CW;
      const c = (CT[q0 + c0] * (1 - cf) + CT[q0 + cx1] * cf) * (1 - fy) + (CT[q1 + c0] * (1 - cf) + CT[q1 + cx1] * cf) * fy;
      let ca = (c - (1 - cov)) * 3.2;
      if (ca > 0) {
        if (ca > 1) ca = 1;
        ca *= 0.85;
        const cl = 0.04 + 0.96 * L;
        r = lerp(r, cr * cl, ca); gg = lerp(gg, cg * cl, ca); b = lerp(b, cb * cl, ca);
      }
    }
    if (haze > 0) {
      const hl = haze * (0.3 + 0.7 * L) * 0.55, hk = 0.08 + 0.92 * L;
      r = lerp(r, 210 * hk, hl); gg = lerp(gg, 142 * hk, hl); b = lerp(b, 72 * hk, hl);
    }
    const rim = g.rim[k] * as;
    if (rim > 0) { const k2 = 0.12 + 0.88 * L; r += (ar * k2 - r) * rim; gg += (ag * k2 - gg) * rim; b += (ab * k2 - b) * rim; }
    const pi = g.pix[k];
    d[pi] = r; d[pi + 1] = gg; d[pi + 2] = b; d[pi + 3] = g.edge[k] * 255;
  }
  pctx.putImageData(PIMG, 0, 0);
}

/* ================================================================ planet scene */
let clock = 0, spin = 0, cspin = 0, moonAng = 2.2;
const impacts = [];
const DEBRIS = [];
{
  const r = rng(5);
  for (let i = 0; i < 650; i++) DEBRIS.push({ a0: r() * TAU, dn: 1.25 + Math.pow(r(), 0.7) * 1.9, yj: (r() - 0.5) * 0.12, jx: (r() - 0.5), jy: (r() - 0.5), s: 0.8 + r() * 1.4, hot: r() });
}

function planetParams(age, T) {
  const P = {};
  for (const k of ['radius', 'magma', 'sea', 'steam', 'cloud', 'haze', 'microbe', 'mature', 'veg', 'snowball', 'cap', 'atmoStr']) P[k] = kf(KF[k], age);
  P.ac = kfc(KF.atmoCol, age);
  P.glow = 1;
  P.lights = sstep(TOTAL - 1.4, TOTAL, T);
  P.flick = Math.sin(clock * 7.1) * 0.5 + Math.sin(clock * 12.7) * 0.5;
  return P;
}

function spawnImpact(big) {
  const a = Math.random() * TAU, rr = Math.sqrt(Math.random()) * 0.8;
  impacts.push({ t: 0, x: Math.cos(a) * rr, y: Math.sin(a) * rr, dir: -2.3 + (Math.random() - 0.5) * 1.3, big: big ? 2.6 : 0.5 + Math.random() * 0.7 });
}
function impactRate(age, i, u) {
  if (i === 2) return 5;
  if (i === 3) return u < IMPACT_U ? 1.5 : 0.3;
  if (i === 4) return lerp(1.2, 0.3, u);
  if (age <= 4100 && age >= 3800) return 2.4;
  if (i === 5) return 0.35;
  return 0.04;
}

function moonScreen(dNorm, R) {
  const dist = lerp(R * 1.75, moonMax, Math.pow(dNorm, 0.8));
  const x = Math.cos(moonAng) * dist, y = Math.sin(moonAng) * dist * 0.2, tl = -0.12;
  return { x: cx + x * Math.cos(tl) - y * Math.sin(tl), y: cy + x * Math.sin(tl) + y * Math.cos(tl), z: Math.sin(moonAng), dist };
}
function orbitPoint(a, dist, yoff) {
  const x = Math.cos(a) * dist, y = Math.sin(a) * dist * 0.2 + yoff, tl = -0.12;
  return [cx + x * Math.cos(tl) - y * Math.sin(tl), cy + x * Math.sin(tl) + y * Math.cos(tl), Math.sin(a)];
}

function drawPlanetScene(T, age, alpha, dt) {
  const i = sceneAt(T), u = sceneU(T, i);
  const P = planetParams(age, T);
  const R = Rfull * P.radius;

  // Theia timeline (scene 4)
  const theiaScene = i === 3;
  const tImp = theiaScene ? (u - IMPACT_U) * SCENES[3].dur : (i > 3 ? 99 : -99);
  if (tImp >= 0 && tImp < 20) P.glow = 1 + 1.3 * Math.exp(-tImp * 0.6);
  let shx = 0, shy = 0;
  if (tImp >= 0 && tImp < 3 && !reduceMotion) {
    const amp = R * 0.05 * Math.exp(-tImp * 2.5);
    shx = (Math.random() - 0.5) * amp; shy = (Math.random() - 0.5) * amp;
  }
  const ocx = cx, ocy = cy;
  cx += shx; cy += shy;

  const hasMoon = age < THEIA_AGE;
  const moonKm = kf(KF.moonKm, age);
  const dNorm = clamp((moonKm - 25000) / (384400 - 25000));
  const moonForm = theiaScene ? sstep(0.72, 0.93, u) : (hasMoon ? 1 : 0);
  const M = moonScreen(dNorm, Rfull);
  const Rm = Rfull * 0.273;

  ctx.save();
  ctx.globalAlpha = alpha;

  // atmosphere / heat halo
  {
    const ac = P.ac, st = P.atmoStr;
    const g1 = ctx.createRadialGradient(cx, cy, R * 0.96, cx, cy, R * (1.16 + 0.12 * P.steam));
    g1.addColorStop(0, `rgba(${ac[0] | 0},${ac[1] | 0},${ac[2] | 0},${0.5 * st})`);
    g1.addColorStop(1, `rgba(${ac[0] | 0},${ac[1] | 0},${ac[2] | 0},0)`);
    ctx.fillStyle = g1;
    ctx.beginPath(); ctx.arc(cx, cy, R * 1.3, 0, TAU); ctx.fill();
    if (P.magma > 0.02) {
      const hg = P.magma * Math.min(1.6, P.glow);
      const g2 = ctx.createRadialGradient(cx, cy, R * 0.9, cx, cy, R * 1.8);
      g2.addColorStop(0, `rgba(255,110,40,${0.32 * hg})`);
      g2.addColorStop(1, 'rgba(255,80,20,0)');
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = g2;
      ctx.beginPath(); ctx.arc(cx, cy, R * 1.8, 0, TAU); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }
  }

  // debris ring (Theia scene) – behind the planet
  const debrisOn = theiaScene && u > IMPACT_U;
  const contact = [cx - R * 0.72, cy - R * 0.62];
  const debrisPts = [];
  if (debrisOn) {
    const spread = sstep(IMPACT_U, 0.56, u), gather = sstep(0.64, 0.95, u), fadeD = 1 - sstep(0.88, 0.99, u);
    for (const p of DEBRIS) {
      const dist = p.dn * Rfull, w = 0.25 * Math.pow(moonMax / dist, 1.5);
      const [ox, oy, oz] = orbitPoint(p.a0 + w * clock, dist, p.yj * Rfull);
      let x = lerp(contact[0], ox, spread), y = lerp(contact[1], oy, spread);
      const tx = M.x + p.jx * Rm * 1.6, ty = M.y + p.jy * Rm * 1.6;
      x = lerp(x, tx, gather); y = lerp(y, ty, gather);
      const z = lerp(oz, M.z, gather);
      debrisPts.push([x, y, z, p]);
    }
    ctx.globalAlpha = alpha * fadeD;
    drawDebris(debrisPts, false, u);
    ctx.globalAlpha = alpha;
  }

  const drawMoon = () => {
    if (moonForm <= 0) return;
    const sc = lerp(0.55, 1, moonForm);
    ctx.globalAlpha = alpha * moonForm;
    const s = Rm * sc;
    ctx.drawImage(moonImg, M.x - s, M.y - s, s * 2, s * 2);
    ctx.globalAlpha = alpha;
  };
  if (M.z < 0) drawMoon();

  // the planet
  P.spin = spin; P.cspin = cspin;
  renderPlanet(P);
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(planetCv, cx - R, cy - R, R * 2, R * 2);

  if (debrisOn) { ctx.globalAlpha = alpha * (1 - sstep(0.88, 0.99, u)); drawDebris(debrisPts, true, u); ctx.globalAlpha = alpha; }
  if (M.z >= 0) drawMoon();

  // Theia
  if (theiaScene && u < 0.47) {
    const e = Math.pow(clamp(u / IMPACT_U), 2.2);
    const rT = Rfull * 0.53 * lerp(0.3, 1, e);
    const sx = cx - vw * 0.62, sy = cy - vh * 0.55;
    const ex = contact[0] - rT * 0.55, ey = contact[1] - rT * 0.45;
    let tx = lerp(sx, ex, e), ty = lerp(sy, ey, e), rr = rT;
    let a = 1;
    if (u > IMPACT_U) { const k = sstep(IMPACT_U, 0.47, u); rr = rT * (1 - 0.6 * k); tx = lerp(ex, contact[0], k); ty = lerp(ey, contact[1], k); a = 1 - k; }
    ctx.globalAlpha = alpha * a;
    ctx.drawImage(theiaImg, tx - rr, ty - rr, rr * 2, rr * 2);
    if (u > IMPACT_U * 0.7) {
      const hg = sstep(IMPACT_U * 0.7, IMPACT_U, u);
      const gl = ctx.createRadialGradient(tx, ty, rr * 0.8, tx, ty, rr * 1.6);
      gl.addColorStop(0, `rgba(255,140,60,${0.35 * hg})`); gl.addColorStop(1, 'rgba(255,100,40,0)');
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(tx, ty, rr * 1.6, 0, TAU); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.globalAlpha = alpha;
  }
  // impact flash
  if (tImp >= 0 && tImp < 4) {
    const k = Math.exp(-tImp * 1.6);
    ctx.globalCompositeOperation = 'lighter';
    const fr = R * (0.4 + tImp * 1.2);
    const gf = ctx.createRadialGradient(contact[0], contact[1], 0, contact[0], contact[1], fr);
    gf.addColorStop(0, `rgba(255,250,230,${0.95 * k})`);
    gf.addColorStop(0.35, `rgba(255,180,90,${0.6 * k})`);
    gf.addColorStop(1, 'rgba(255,100,40,0)');
    ctx.fillStyle = gf; ctx.beginPath(); ctx.arc(contact[0], contact[1], fr, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    if (tImp < 1 && !reduceMotion) {
      ctx.fillStyle = `rgba(255,244,225,${0.55 * Math.exp(-tImp * 5)})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  // impacts
  for (let k = impacts.length - 1; k >= 0; k--) {
    const m = impacts[k];
    m.t += dt;
    const tx = cx + m.x * R, ty = cy + m.y * R;
    const STREAK = 0.35;
    if (m.t < STREAK) {
      const e = m.t / STREAK, len = R * 2.2 * (1 - e);
      const hx = tx - Math.cos(m.dir) * len, hy = ty - Math.sin(m.dir) * len;
      const tail = R * 0.35 * m.big;
      const gx = hx - Math.cos(m.dir) * tail, gy = hy - Math.sin(m.dir) * tail;
      const lg = ctx.createLinearGradient(gx, gy, hx, hy);
      lg.addColorStop(0, 'rgba(255,200,140,0)'); lg.addColorStop(1, 'rgba(255,236,200,0.95)');
      ctx.strokeStyle = lg; ctx.lineWidth = 1.2 + m.big; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(hx, hy); ctx.stroke();
    } else {
      const ft = (m.t - STREAK) / (0.9 + 0.5 * m.big);
      if (ft >= 1) { impacts.splice(k, 1); continue; }
      const rad = R * 0.1 * m.big * Math.sqrt(ft) + 2;
      const gi = ctx.createRadialGradient(tx, ty, 0, tx, ty, rad);
      gi.addColorStop(0, `rgba(255,246,220,${1 - ft})`);
      gi.addColorStop(0.4, `rgba(255,150,60,${0.8 * (1 - ft)})`);
      gi.addColorStop(1, 'rgba(255,90,30,0)');
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = gi; ctx.beginPath(); ctx.arc(tx, ty, rad, 0, TAU); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }
  }

  // label while the embryo is still a naked proto-planet
  if (i === 2) {
    ctx.globalAlpha = alpha * sstep(0.35, 0.5, u);
    ctx.fillStyle = 'rgba(255,214,186,0.9)';
    ctx.font = '500 11px "IBM Plex Mono", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('ÇEKİRDEK AYRIŞIYOR · YÜZEY ERİMİŞ', cx, cy + R * 1.35 + 14);
  }
  ctx.restore();
  cx = ocx; cy = ocy;
}

function drawDebris(pts, front, u) {
  const cool = sstep(0.5, 0.9, u);
  ctx.globalCompositeOperation = 'lighter';
  for (const [x, y, z, p] of pts) {
    if ((z >= 0) !== front) continue;
    const hot = clamp(p.hot * 0.6 + 0.4 - cool * 0.8);
    ctx.fillStyle = `rgb(${Math.round(lerp(150, 255, hot))},${Math.round(lerp(140, 150, hot))},${Math.round(lerp(135, 70, hot))})`;
    ctx.fillRect(x - p.s / 2, y - p.s / 2, p.s, p.s);
  }
  ctx.globalCompositeOperation = 'source-over';
}

  seg.innerHTML = `<div class="bar"><div class="fill"></div></div><span class="lbl">${s.short}</span>`;
  ui.segs.appendChild(seg);
  s.el = seg; s.fill = seg.querySelector('.fill');
});
// event dots sit on the same (non-linear) axis as the segments
function placeMarks() {
  ui.marks.innerHTML = '';
  const gapsPx = 3 * (SCENES.length - 1), wpx = ui.timeline.clientWidth;
  for (const ev of EVENTS) {
    const t = timeForAge(ev.age), i = sceneAt(t);
    const x = (t / TOTAL) * (wpx - gapsPx) + i * 3;
    const m = document.createElement('div');
    m.className = 'mark';
    m.style.left = x + 'px';
    m.title = ev.text;
    ev.el = m; ev.t = t;
    ui.marks.appendChild(m);
  }
}
function timeToPx(T) {
  const gapsPx = 3 * (SCENES.length - 1), wpx = ui.timeline.clientWidth;
  return (T / TOTAL) * (wpx - gapsPx) + sceneAt(T) * 3;
}
function pxToTime(x) {
  const gapsPx = 3 * (SCENES.length - 1), wpx = ui.timeline.clientWidth;
  // walk segments to honour the gaps
  let acc = 0;
  for (let k = 0; k < SCENES.length; k++) {
    const sw = (SCENES[k].dur / TOTAL) * (wpx - gapsPx);
    if (x <= acc + sw || k === SCENES.length - 1) return clamp(SCENES[k].t0 + clamp((x - acc) / sw) * SCENES[k].dur, 0, TOTAL);
    acc += sw + 3;
  }
  return TOTAL;
}

let T = 0, playing = !reduceMotion, speed = 1, lastScene = -1, toastTimer = 0, cache = {};
function setText(el, key, v) { if (cache[key] !== v) { cache[key] = v; el.textContent = v; } }

function updateUI(age) {
  const i = sceneAt(T), s = SCENES[i];
  if (i !== lastScene) {
    lastScene = i;
    document.documentElement.style.setProperty('--era', s.color);
    ui.era.textContent = s.name;
    ui.desc.textContent = s.text;
    ui.chapter.textContent = `Bölüm ${i + 1} / ${SCENES.length}`;
    ui.chapterSpan.textContent = s.a1 === 0 ? `${fmtMy(s.a0)} My – bugün` : `${fmtMy(s.a0)}–${fmtMy(s.a1)} My`;
    SCENES.forEach((x, k) => x.el.classList.toggle('on', k === i));
  }
  const [num, unit] = fmtAge(age);
  setText(ui.ageNum, 'an', num); setText(ui.ageUnit, 'au', unit);
  setText(ui.since, 'si', 'Güneş Sistemi\'nin yaşı: ' + fmtSpan(SCENES[0].a0 - age));
  const planet = i >= 2;
  setText(ui.rTemp, 'rt', planet ? nf0.format(Math.round(kf(KF.temp, age) / 5) * 5) + ' °C' : '−200…1.500 °C');
  setText(ui.rMass, 'rm', i === 0 ? '—' : '%' + (kf(KF.mass, age) < 10 ? nf1 : nf0).format(kf(KF.mass, age)));
  setText(ui.rDay, 'rd', age < 4506 ? nf1.format(kf(KF.day, age)) + ' saat' : '—');
  setText(ui.rMoon, 'rmo', age < 4506 ? nf0.format(Math.round(kf(KF.moonKm, age) / 100) * 100) + ' km' : '—');
  setText(ui.rAtmo, 'ra', atmoText(age));
  for (let k = 0; k < SCENES.length; k++) {
    const w = (clamp((T - SCENES[k].t0) / SCENES[k].dur) * 100).toFixed(2) + '%';
    if (cache['f' + k] !== w) { cache['f' + k] = w; SCENES[k].fill.style.width = w; }
  }
  ui.playhead.style.left = timeToPx(T) + 'px';
  ui.timeline.setAttribute('aria-valuenow', Math.round(T / TOTAL * 100));
  ui.timeline.setAttribute('aria-valuetext', num + ' ' + unit);
  for (const ev of EVENTS) if (ev.el) ev.el.classList.toggle('past', ev.t <= T);
}

function showToast(ev) {
  const [n, u] = fmtAge(ev.age);
  ui.toast.innerHTML = '';
  const i = document.createElement('i'); i.textContent = n + ' ' + u.replace(' önce', '');
  ui.toast.append(i, document.createTextNode(ev.text));
  ui.toast.hidden = false;
  ui.toast.style.animation = 'none'; void ui.toast.offsetWidth; ui.toast.style.animation = '';
  toastTimer = 4.2;
}

function setPlaying(p) {
  playing = p;
  ui.icoPlay.hidden = p; ui.icoPause.hidden = !p;
  ui.play.setAttribute('aria-label', p ? 'Duraklat' : 'Oynat');
}
function seek(t) {
  T = clamp(t, 0, TOTAL);
  impacts.length = 0;
  ui.toast.hidden = true;
}

ui.play.addEventListener('click', () => {
  if (!playing && T >= TOTAL) seek(0);
  setPlaying(!playing);
});
ui.restart.addEventListener('click', () => { seek(0); setPlaying(true); });
document.querySelectorAll('.speed button').forEach(b => b.addEventListener('click', () => {
  speed = parseFloat(b.dataset.speed);
  document.querySelectorAll('.speed button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
}));
ui.more.addEventListener('click', () => {
  const open = ui.desc.classList.toggle('open');
  ui.more.textContent = open ? 'Daha az göster' : 'Devamını oku';
  ui.more.setAttribute('aria-expanded', String(open));
});
{
  let drag = false;
  const at = e => { const r = ui.timeline.getBoundingClientRect(); seek(pxToTime(e.clientX - r.left)); };
  ui.timeline.addEventListener('pointerdown', e => { drag = true; ui.timeline.setPointerCapture(e.pointerId); at(e); });
  ui.timeline.addEventListener('pointermove', e => { if (drag) at(e); });
  const end = () => { drag = false; };
  ui.timeline.addEventListener('pointerup', end);
  ui.timeline.addEventListener('pointercancel', end);
  ui.timeline.addEventListener('keydown', e => {
    const step = e.shiftKey ? 8 : 2;
    if (e.key === 'ArrowRight') { seek(T + step); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { seek(T - step); e.preventDefault(); }
    else if (e.key === 'Home') { seek(0); e.preventDefault(); }
    else if (e.key === 'End') { seek(TOTAL); e.preventDefault(); }
    else if (e.key === 'PageDown') { seek(SCENES[Math.min(SCENES.length - 1, sceneAt(T) + 1)].t0); e.preventDefault(); }
    else if (e.key === 'PageUp') { seek(SCENES[Math.max(0, sceneAt(T) - 1)].t0); e.preventDefault(); }
  });
}
document.addEventListener('keydown', e => {
  if (e.key === ' ' && !(e.target instanceof HTMLButtonElement)) { e.preventDefault(); ui.play.click(); }
});

/* ================================================================ main loop */
let lastNow = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastNow) / 1000);
  lastNow = now;
  const prevT = T;
  if (playing) {
    T = Math.min(TOTAL, T + dt * speed);
    if (T >= TOTAL) setPlaying(false);
  }
  clock += dt;
  const age = ageAt(T), i = sceneAt(T), u = sceneU(T, i);

  // planet spin follows the length of the day: a young Earth spun much faster
  const day = age < 4506 ? kf(KF.day, age) : 7;
  spin += dt * 0.28 * (24 / day) * (reduceMotion ? 0.3 : 1);
  cspin += dt * 0.28 * (24 / day) * 0.93 * (reduceMotion ? 0.3 : 1);
  if (age < THEIA_AGE || i === 3) {
    const dN = clamp((kf(KF.moonKm, age) - 25000) / (384400 - 25000));
    const dist = lerp(Rfull * 1.75, moonMax, Math.pow(dN, 0.8));
    moonAng += dt * Math.min(1.4, 0.25 * Math.pow(moonMax / dist, 1.5)) * (reduceMotion ? 0.3 : 1);
  }

  // events crossed while playing
  if (playing && T > prevT) {
    const a0 = ageAt(prevT);
    for (const ev of EVENTS) {
      if (a0 > ev.age && age <= ev.age) {
        showToast(ev);
        if (ev.impact) spawnImpact(true);
      }
    }
    if (i >= 2) {
      const n = impactRate(age, i, u) * dt * speed;
      if (Math.random() < n) spawnImpact(false);
    }
  }
  if (toastTimer > 0) { toastTimer -= dt; if (toastTimer <= 0) ui.toast.hidden = true; }

  // draw
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(starCv, 0, 0);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const diskA = i < 2 ? 1 : i === 2 ? 1 - sstep(0.18, 0.32, u) : 0;
  if (i >= 1 && diskA > 0) nbSync(T);
  if (diskA > 0) drawDiskView(T, diskA);
  if (i >= 2) {
    const pA = i === 2 ? sstep(0.13, 0.3, u) : 1;
    drawPlanetScene(T, age, pA, dt);
  }
  updateUI(age);
  requestAnimationFrame(frame);
}

function start(data) {
  buildTextures();
  layout();
  placeMarks();
  if (data && typeof data.T === 'number') seek(data.T);
  if (data && typeof data.speed === 'number') {
    speed = data.speed;
    document.querySelectorAll('.speed button').forEach(x => x.setAttribute('aria-pressed', String(parseFloat(x.dataset.speed) === speed)));
  }
  setPlaying(playing);
  let rt = 0;
  const onResize = () => { clearTimeout(rt); rt = setTimeout(() => { layout(); placeMarks(); }, 120); };
  window.addEventListener('resize', onResize);
  if (window.ResizeObserver) new ResizeObserver(onResize).observe(stageEl);
  requestAnimationFrame(t => { lastNow = t; frame(t); });
}

const hot = window.claude && window.claude.hot;
if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ T, speed }));
if (hot && typeof hot.ready === 'function') hot.ready(start);
else start((hot && hot.data) || {});
})();
</script>
</body>
</html>
