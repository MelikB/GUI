<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dünya'nın Doğuşu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed space canvas; header top-left, chapter panel on the right, timeline dock across the bottom.
   One deliberate dark look (deep space). The accent follows the era: dust violet → magma → ocean → life. */
:root {
  --void: #04060c;
  --ink: #e7eaf3;
  --ink-2: #99a2b8;
  --line: rgba(150, 165, 205, 0.2);
  --panel: rgba(7, 10, 19, 0.66);
  --era: #b9a6ff;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--void);
  color: var(--ink);
  font: 400 14px/1.55 var(--f-body);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
#sky, #gl, #ovl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#gl { opacity: 0; pointer-events: none; touch-action: none; }
#ovl { pointer-events: none; }
body.gl-on #gl { pointer-events: auto; cursor: grab; }
body.gl-on #gl:active { cursor: grabbing; }

.app {
  position: relative;
  box-sizing: border-box;
  height: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 330px;
  grid-template-rows: auto minmax(0, 1fr) auto;
  column-gap: 28px;
  row-gap: 12px;
  padding-inline: 28px;
  padding-block: 22px 18px;
  pointer-events: none;
}
.head, .panel, .dock, .views { pointer-events: auto; }

.head { grid-column: 1; grid-row: 1; min-width: 0; text-shadow: 0 1px 12px rgba(4, 6, 12, 0.7); }
.eyebrow {
  margin: 0 0 6px;
  font: 500 11px/1.3 var(--f-mono);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-2);
}
.eyebrow b { color: var(--era); font-weight: 500; transition: color .8s; }
h1 {
  margin: 0;
  font: 750 clamp(30px, 5.2vw, 60px)/0.98 var(--f-display);
  font-variation-settings: "opsz" 96;
  letter-spacing: -0.02em;
  text-wrap: balance;
}
.age {
  margin: 10px 0 0;
  display: flex; align-items: baseline; flex-wrap: wrap; gap: 0 10px;
  font-family: var(--f-mono);
  font-variant-numeric: tabular-nums;
}
.age #ageNum { font-size: clamp(20px, 2.6vw, 28px); font-weight: 500; color: var(--era); transition: color .8s; }
.age #ageUnit { font-size: 13px; color: var(--ink-2); }
.since { margin: 2px 0 0; font: 400 12px/1.4 var(--f-mono); color: var(--ink-2); font-variant-numeric: tabular-nums; }

#stage { grid-column: 1; grid-row: 2; position: relative; min-height: 0; }
.views {
  position: absolute; top: 0; right: 0;
  display: flex; padding: 3px;
  border: 1px solid var(--line); border-radius: 999px;
  background: var(--panel);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.views button {
  border: 0; background: none; color: var(--ink-2);
  font: 500 12px/1 var(--f-body);
  padding: 7px 11px; border-radius: 999px; cursor: pointer;
  white-space: nowrap;
}
.views button[aria-pressed="true"] { background: rgba(150, 165, 205, 0.2); color: var(--ink); }
.views button[aria-pressed="true"].auto-on { box-shadow: inset 0 0 0 1px var(--era); }
.views button:disabled { opacity: .35; cursor: not-allowed; }
.toast {
  position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%);
  max-width: min(460px, 100%);
  box-sizing: border-box;
  padding: 8px 14px;
  border-radius: 999px;
  background: var(--panel);
  border: 1px solid var(--line);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  font: 500 13px/1.35 var(--f-body);
  text-align: center;
  animation: toastIn .45s ease-out;
}
.toast i { font-style: normal; font-family: var(--f-mono); color: var(--era); margin-right: 6px; }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 8px); } }

.panel {
  grid-column: 2; grid-row: 1 / span 2; align-self: start;
  min-width: 0;
  display: grid; gap: 14px;
  padding: 18px 18px 16px;
  border-radius: 14px;
  background: var(--panel);
  border: 1px solid var(--line);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.chapter {
  margin: 0;
  display: flex; justify-content: space-between; gap: 8px;
  font: 500 11px/1.3 var(--f-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-2);
}
.chapter span:last-child { color: var(--era); transition: color .8s; text-align: right; }
.desc { margin: 0; font-size: 14px; line-height: 1.6; color: var(--ink); max-width: 62ch; }
.more {
  display: none; justify-self: start;
  padding: 0; border: 0; background: none; color: var(--era);
  font: 500 12px/1.4 var(--f-body); cursor: pointer;
}
.readouts {
  margin: 0;
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: 10px; overflow: hidden;
}
.readouts > div { background: var(--void); padding: 8px 10px; min-width: 0; }
.readouts .wide { grid-column: 1 / -1; }
.readouts dt { font: 500 10px/1.3 var(--f-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2); }
.readouts dd { margin: 3px 0 0; font: 500 15px/1.3 var(--f-mono); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

.dock {
  grid-column: 1 / -1; grid-row: 3;
  display: flex; align-items: center; gap: 14px;
}
.btn {
  flex: none;
  width: 42px; height: 42px;
  display: grid; place-items: center;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--ink);
  cursor: pointer;
  font: 500 12px/1 var(--f-mono);
  transition: border-color .2s, background .2s;
}
.btn:hover { border-color: var(--era); }
.btn.primary { background: var(--era); color: var(--void); border-color: transparent; }
.btn svg { width: 18px; height: 18px; fill: currentColor; }
.btn:focus-visible, .timeline:focus-visible, .views button:focus-visible, .more:focus-visible {
  outline: 2px solid var(--era); outline-offset: 3px;
}
.timeline {
  position: relative; flex: 1 1 auto; min-width: 0;
  height: 46px;
  cursor: pointer;
  touch-action: none;
  border-radius: 8px;
}
.segs { position: absolute; left: 0; right: 0; top: 14px; display: flex; gap: 3px; }
.seg { position: relative; min-width: 0; }
.seg .bar { height: 6px; border-radius: 3px; background: rgba(150, 165, 205, 0.22); overflow: hidden; }
.seg .fill { height: 100%; width: 0; background: var(--era); transition: background .8s; }
.seg .lbl {
  display: block; margin-top: 7px;
  font: 500 10px/1.2 var(--f-mono); letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--ink-2);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.seg.on .lbl { color: var(--ink); }
.marks { position: absolute; left: 0; right: 0; top: 4px; height: 6px; }
.mark { position: absolute; top: 0; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--ink-2); opacity: .7; }
.mark.past { background: var(--era); opacity: 1; }
.playhead {
  position: absolute; top: 8px; width: 2px; height: 18px; margin-left: -1px;
  background: var(--ink); border-radius: 1px;
  box-shadow: 0 0 10px var(--era);
}

@media (max-width: 860px) {
  .app {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(200px, 1fr) auto auto;
    padding-inline: 16px;
    padding-block: 14px 12px;
    row-gap: 10px;
  }
  .panel { grid-column: 1; grid-row: 3; padding: 12px 14px; gap: 10px; }
  .dock { grid-row: 4; flex-wrap: wrap; gap: 10px; }
  .timeline { order: -1; flex-basis: 100%; }
  .views { left: 50%; right: auto; transform: translateX(-50%); }
  .views button { padding: 6px 9px; font-size: 11px; }
  .desc { font-size: 13px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .desc.open { display: block; }
  .more { display: inline; }
  .readouts { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .readouts dd { font-size: 12.5px; }
  .seg .lbl { visibility: hidden; }
  .seg.on .lbl { visibility: visible; overflow: visible; }
}
@media (max-width: 860px) and (max-height: 760px) {
  .since { display: none; }
  .readouts > div { padding: 6px 8px; }
}
@media (prefers-reduced-motion: reduce) {
  .toast { animation: none; }
}
</style>
</head>

      <div class="marks" id="marks"></div>
      <div class="segs" id="segs"></div>
      <div class="playhead" id="playhead"></div>
    </div>
    <button class="btn" id="speed" type="button" aria-label="Simülasyon hızı: 1×">1×</button>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

// Ages in millions of years ago (My). Each scene maps its own slice of the timeline and has a camera script.

const SCENES = [

  scene.add(sphere);
  const chunkMat = new THREE.MeshPhongMaterial({ map: sTex, emissiveMap: eTex, emissive: 0xffffff, shininess: 10, transparent: true, side: THREE.DoubleSide });

    uniforms: { uCol: { value: new THREE.Color(1, 0.6, 0.3) }, uStr: { value: 0.6 } },
    vertexShader: `varying vec3 vN; varying vec3 vP;
      void main(){ vec4 wp = modelMatrix * vec4(position, 1.0); vP = wp.xyz; vN = normalize(mat3(modelMatrix) * normal); gl_Position = projectionMatrix * viewMatrix * wp; }`,
    fragmentShader: `uniform vec3 uCol; uniform float uStr; varying vec3 vN; varying vec3 vP;
      void main(){ vec3 V = normalize(cameraPosition - vP); float f = pow(1.0 - abs(dot(normalize(vN), V)), 2.2); gl_FragColor = vec4(uCol * f * uStr, f * uStr); }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,

  for (let k = 0; k < 150; k++) drops.push({ r: r(), th: r() * Math.PI / 2, v: 0.6 + r() * 0.8, s: 1 + r() * 1.6 });
  for (let k = 0; k < 6; k++) diap.push({ r: r(), th: 0.15 + r() * 1.25, v: 0.25 + r() * 0.2, s: 5 + r() * 5 });

// Equirectangular colour + emissive maps for the 3D globe, from the same parameters as the 2D renderer.
function paintSurfaceTex(I, P) {
  const sd = I.sImg.data, ed = I.eImg.data;
  const sea = P.sea, landDen = 1 / Math.max(0.03, 1 - sea), seaDen = 1 / Math.max(0.03, sea);
  const mg = P.magma, th = 1 - mg, cov = Math.max(P.cloud, P.steam);
  const cr = lerp(242, 214, P.steam), cg = lerp(244, 190, P.steam), cb = lerp(248, 160, P.steam);
  const rb = lerp(58, 130, P.mature), gb = lerp(51, 110, P.mature), bb = lerp(48, 86, P.mature);
  for (let j = 0; j < TH; j++) {
    const alat = Math.abs(Math.PI / 2 - (j + 0.5) / TH * Math.PI), desert = Math.exp(-Math.pow((alat - 0.42) / 0.13, 2)) * 0.8;
    for (let i = 0; i < TW; i++) {
      const k = j * TW + i, h = HT[k], q = RT[k];
      let r, g, b, er = 0, eg = 0, eb = 0, wet = false;
      if (h < sea) {
        wet = true;
        const t = Math.min(1, (sea - h) * seaDen * 1.8);
        r = lerp(36, 6, t); g = lerp(122, 32, t); b = lerp(150, 80, t);
      } else {
        const e = (h - sea) * landDen;
        r = rb + e * 32; g = gb + e * 26; b = bb + e * 22;
        if (P.veg > 0) { const v = P.veg * Math.max(0, 1 - e * 1.7) * (1 - desert); r = lerp(r, 48, v); g = lerp(g, 98, v); b = lerp(b, 44, v); }
      }
      let ice = alat + (h - 0.5) * 0.25 - P.cap; ice = ice > 0 ? Math.min(1, ice * 12) : 0;
      if (P.snowball > 0) ice = Math.max(ice, clamp(P.snowball * 1.3 - (1 - q) * 0.2));
      if (ice > 0) { r = lerp(r, 226, ice); g = lerp(g, 235, ice); b = lerp(b, 244, ice); }
      if (mg > 0) {
        let la = mg >= 0.999 ? 1 : (q - th + 0.08) * 6;
        if (la > 0) {
          la = Math.min(1, la);
          const heat = mg >= 0.999 ? 0.5 + 0.5 * q : q;
          er = 255 * la * (0.55 + 0.6 * heat); eg = (40 + 190 * heat * heat) * la; eb = (12 + 120 * heat ** 3) * la;
          r *= 1 - la; g *= 1 - la; b *= 1 - la;
        }
      }
      const c = CT[k];
      let ca = cov > 0 ? (c - (1 - cov)) * 3.2 : 0;
      if (ca > 0) { ca = Math.min(1, ca) * 0.85; r = lerp(r, cr, ca); g = lerp(g, cg, ca); b = lerp(b, cb, ca); er *= 1 - ca * 0.6; eg *= 1 - ca * 0.6; eb *= 1 - ca * 0.6; }
      if (P.haze > 0) { const hl = P.haze * 0.5; r = lerp(r, 210, hl); g = lerp(g, 142, hl); b = lerp(b, 72, hl); }
      const p = k * 4;
      sd[p] = r; sd[p + 1] = g; sd[p + 2] = b; sd[p + 3] = 255;
      ed[p] = er; ed[p + 1] = eg; ed[p + 2] = eb; ed[p + 3] = 255;
    }
  }
  I.sCtx.putImageData(I.sImg, 0, 0); I.eCtx.putImageData(I.eImg, 0, 0);
  I.sTex.needsUpdate = true; I.eTex.needsUpdate = true;
}

function interiorState(age) {
  const R = kf(KF.radius, age);
  return {
    coreR: kf(KF.coreR, age), innerR: kf(KF.innerR, age), mo: kf(KF.moBase, age), crust: kf(KF.crust, age),
    iron: kf(KF.ironRain, age), dynamo: kf(KF.dynamo, age), sea: kf(KF.sea, age), steam: kf(KF.steam, age),
    ac: kfc(KF.atmoCol, age), radius: R,
  };
}

// The three cut faces share one canvas: a quarter disk centred on the canvas middle.
function paintWalls(I, S, dt) {
  const c = I.wCtx, C = 256, k = C / I.WR;
  const rp = r => r * k;
  c.clearRect(0, 0, 512, 512);
  const ring = (r0, r1, fill) => {
    c.beginPath(); c.arc(C, C, rp(r1), -Math.PI / 2, 0); c.arc(C, C, rp(r0), 0, -Math.PI / 2, true); c.closePath();
    c.fillStyle = fill; c.fill();
  };
  const rad = (r0, r1, stops) => { const g = c.createRadialGradient(C, C, rp(r0), C, C, rp(r1)); stops.forEach(([o, col]) => g.addColorStop(o, col)); return g; };
  const ac = S.ac, atmT = 0.04 + 0.08 * S.steam;
  ring(1, 1 + atmT, rad(1, 1 + atmT, [[0, `rgba(${ac[0] | 0},${ac[1] | 0},${ac[2] | 0},0.6)`], [1, `rgba(${ac[0] | 0},${ac[1] | 0},${ac[2] | 0},0)`]]));
  const top = 1 - S.crust;
  ring(S.coreR, S.mo, rad(S.coreR, S.mo, [[0, '#c4471c'], [0.5, '#8a2c16'], [1, '#5a1d12']]));
  if (S.mo < top) ring(S.mo, top, rad(S.mo, top, [[0, '#ff7a24'], [0.6, '#ffa040'], [1, '#ffcf6a']]));
  if (S.crust > 0.002) ring(top, 1, '#3a3330');
  if (S.sea > 0.05) ring(1 - 0.01, 1, 'rgba(40,110,170,0.95)');
  ring(S.innerR, S.coreR, rad(S.innerR, S.coreR, [[0, '#ffd27a'], [1, '#ff9f3d']]));
  if (S.innerR > 0.005) ring(0, S.innerR, rad(0, S.innerR, [[0, '#fffbe6'], [1, '#ffe7a6']]));
  // boundaries
  c.strokeStyle = 'rgba(20,10,8,0.45)'; c.lineWidth = 1.2;
  for (const r of [S.coreR, S.mo < 1 ? S.mo : 0, S.innerR, top]) if (r > 0.01 && r < 1) { c.beginPath(); c.arc(C, C, rp(r), -Math.PI / 2, 0); c.stroke(); }
  const pt = (r, th) => [C + rp(r) * Math.cos(th), C - rp(r) * Math.sin(th)];
  // convection: fast swirls in the magma ocean, slow cells in the solid mantle, eddies in the liquid core
  const bands = [
    [S.mo, top, 3, 1.6, 'rgba(255,240,170,0.75)'],
    [S.coreR, S.mo, 4, 0.22, 'rgba(255,190,140,0.32)'],
    [S.innerR, S.coreR, 3, 0.9, 'rgba(255,250,215,0.5)'],
  ];
  for (const cl of I.cells) {
    const [r0, r1, n, sp, col] = bands[cl.band];
    if (r1 - r0 < 0.03) continue;
    const ci = cl.c % n, thc = (ci + 0.5) * (Math.PI / 2) / n, rc = (r0 + r1) / 2;
    const ar = (r1 - r0) * 0.42 * cl.rr, at = (Math.PI / 2 / n) * 0.42 * cl.rr / Math.max(0.3, rc);
    const ph = cl.ph + clock * sp * cl.s * (ci % 2 ? 1 : -1) / Math.max(0.4, cl.rr);
    const [x, y] = pt(rc + Math.cos(ph) * ar, thc + Math.sin(ph) * at);
    c.fillStyle = col; c.fillRect(x - 1.2, y - 1.2, 2.4, 2.4);
  }
  // iron rain: droplets pond at the base of the magma ocean, then sink as diapirs to the core
  if (S.iron > 0.02) {
    c.fillStyle = 'rgba(214,222,236,0.95)'; c.strokeStyle = 'rgba(40,30,30,0.6)'; c.lineWidth = 1;
    for (const d of I.drops) {
      d.r -= d.v * 0.08 * dt * S.iron;
      if (d.r < S.coreR || d.r > top) d.r = lerp(S.mo, top, Math.random()), d.th = 0.05 + Math.random() * 1.47;
      const [x, y] = pt(d.r, d.th);
      c.beginPath(); c.arc(x, y, d.s, 0, TAU); c.fill();
    }
    for (const d of I.diap) {
      d.r -= d.v * 0.08 * dt * S.iron;
      if (d.r < S.coreR) d.r = S.mo, d.th = 0.15 + Math.random() * 1.25;
      const [x, y] = pt(d.r, d.th);
      c.beginPath(); c.ellipse(x, y, d.s * 0.8, d.s, -d.th + Math.PI / 2, 0, TAU); c.fill(); c.stroke();
    }
  }
  // crystal mush at the solidification front
  if (S.mo > S.coreR + 0.02 && S.mo < 0.995 && S.iron < 0.05) {
    const r = rng(11);
    c.fillStyle = 'rgba(255,245,220,0.8)';
    for (let k = 0; k < 90; k++) {
      const [x, y] = pt(S.mo + (r() - 0.3) * 0.03, r() * Math.PI / 2);
      if (r() < 0.5 + 0.5 * Math.sin(clock * 3 + k)) c.fillRect(x - 1, y - 1, 2, 2);
    }
  }
  I.wTex.needsUpdate = true;
}

function renderInterior(G, age, P, since, dt) {
  const I = G.int, S = interiorState(age);
  if ((Math.abs(age - I.lastAge) > 1e-6 && clock - I.lastPaint > 0.3) || I.lastPaint < 0) {
    paintSurfaceTex(I, P); I.lastAge = age; I.lastPaint = clock;
  }
  paintWalls(I, S, dt);

  const yaw = 0.8 + 0.12 * Math.sin(clock * 0.13) + G.iYaw, pitch = 0.4 + 0.05 * Math.sin(clock * 0.1) + G.iPitch;

  cam.lookAt(0, 0, 0);
  cam.setViewOffset(W, H, W / 2 - cx, H / 2 - cy, W, H);

function drawInteriorLabels(G, alpha) {
  const L = G.lastInterior; if (!L) return;
  const { S, cam } = L;
  const lab = [];
  const atmT = 0.04 + 0.08 * S.steam, top = 1 - S.crust;
  lab.push({ r: 1 + atmT * 0.5, th: 1.32, t: S.steam > 0.3 ? 'Buhar atmosferi' : 'Atmosfer', s: 'kalınlık abartılı' });
  if (S.crust > 0.004) lab.push({ r: 1 - S.crust / 2, th: 1.16, t: 'Kabuk', s: S.crust > 0.025 ? '0–35 km' : 'ilk bazalt kabuk' });
  if (S.mo < top - 0.01) lab.push({ r: (S.mo + top) / 2, th: 1.0, t: 'Magma okyanusu', s: `~${nf0.format(Math.round((1 - S.mo) * 6371 * S.radius / 100) * 100)} km derin` });
  if (S.mo - S.coreR > 0.03) lab.push({ r: (S.coreR + S.mo) / 2, th: 0.78, t: 'Manto', s: S.iron > 0.05 ? 'kısmen erimiş' : S.mo < 0.995 ? 'aşağıdan yukarı katılaşıyor' : 'katı ama yavaşça akıyor' });
  if (S.iron > 0.2) lab.push({ r: (S.coreR + S.mo) / 2 + 0.06, th: 0.42, t: 'Demir damlaları', s: 'çekirdeğe çöküyor' });
  if (S.innerR > 0.01) {
    lab.push({ r: (S.innerR + S.coreR) / 2, th: 0.5, t: 'Dış çekirdek', s: 'sıvı demir-nikel' });
    lab.push({ r: S.innerR * 0.6, th: 0.3, t: 'İç çekirdek', s: 'katı · ~5.400 °C' });
  } else lab.push({ r: S.coreR * 0.6, th: 0.4, t: 'Çekirdek', s: S.coreR < 0.53 ? 'büyüyor · erimiş demir' : 'sıvı demir-nikel' });
  if (S.dynamo > 0.3) lab.push({ r: 1.55, th: 1.2, t: 'Manyetik alan', s: 'jeodinamo · çekirdekteki akıntılar' });

    octx.fillStyle = '#fff'; octx.beginPath(); octx.arc(p.x, p.y, 2.5, 0, TAU); octx.fill();
    if (compact) {
      octx.font = '500 10px "IBM Plex Mono", monospace';

      const tx = Math.min(p.x + 8, cx + vw / 2 - w - 8);

      octx.fillStyle = '#e7eaf3'; octx.fillText(p.t.toUpperCase(), tx, p.ty + 2);
    } else {
      octx.strokeStyle = 'rgba(231,234,243,0.55)'; octx.lineWidth = 1;
      octx.beginPath(); octx.moveTo(p.x, p.y); octx.lineTo(colX - 8, p.ty); octx.stroke();
      octx.font = '600 12px "IBM Plex Sans", sans-serif'; octx.fillStyle = '#e7eaf3';
      octx.fillText(p.t, colX, p.ty + 1);
      octx.font = '400 11px "IBM Plex Mono", monospace'; octx.fillStyle = '#99a2b8';
      octx.fillText(p.s, colX, p.ty + 15);
    }
  }
  octx.restore();
}

/* ---------- surface: a 3D landscape and atmosphere */
function buildSurface(G) {
  const scene = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(58, 1, 0.5, 3000);
  scene.fog = new THREE.FogExp2(0x000000, 0.004);
  const U = {
    uSun: { value: new THREE.Vector3(-0.55, 0.42, 0.45).normalize() }, uSunCol: { value: new THREE.Color() }, uAmb: { value: new THREE.Color() },
    uFogCol: { value: new THREE.Color() }, uFogD: { value: 0.004 }, uTime: { value: 0 }, uFlash: { value: 0 },
    uZen: { value: new THREE.Color() }, uHor: { value: new THREE.Color() }, uStars: { value: 0 }, uGlowBelow: { value: 0 }, uDust: { value: 0 },
    uMagma: { value: 0 }, uVeg: { value: 0 }, uIce: { value: 0 }, uMature: { value: 0 }, uW: { value: 0 }, uVolc: { value: 0 }, uWet: { value: 0 },
    uWater: { value: new THREE.Color() }, uCov: { value: 0 }, uCloudTop: { value: new THREE.Color() }, uCloudBot: { value: new THREE.Color() },
    uCloudOp: { value: 0.8 }, uRain: { value: 0 }, uCam: { value: new THREE.Vector3() },
  };
  // sky dome
  const sky = new THREE.Mesh(new THREE.SphereGeometry(1400, 32, 16), new THREE.ShaderMaterial({
    uniforms: U, side: THREE.BackSide, depthWrite: false,
    vertexShader: `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `uniform vec3 uZen; uniform vec3 uHor; uniform vec3 uSun; uniform vec3 uSunCol; uniform float uStars; uniform float uGlowBelow; uniform float uFlash; uniform float uDust;
      varying vec3 vDir;
      void main(){
        vec3 d = normalize(vDir); float h = d.y;
        vec3 col = mix(uHor, uZen, pow(clamp(h, 0.0, 1.0), 0.45));
        if (h < 0.0) col = uHor * 0.7;
        float sd = max(dot(d, uSun), 0.0);
        col += uSunCol * (pow(sd, 900.0) * 6.0 + pow(sd, 14.0) * 0.28);
        vec3 p = floor(d * 260.0);
        float s = fract(sin(dot(p, vec3(12.9898, 78.233, 37.719))) * 43758.5453);
        col += vec3(step(0.9975, s)) * uStars * clamp(h * 4.0, 0.0, 1.0);
        col += uGlowBelow * vec3(1.0, 0.33, 0.08) * pow(1.0 - clamp(h, 0.0, 1.0), 6.0);
        col = mix(col, vec3(0.12, 0.09, 0.07), uDust);
        col += vec3(uFlash);
        gl_FragColor = vec4(col, 1.0);
      }`,
  }));
  sky.renderOrder = -2; scene.add(sky);
  // terrain
  const tg = new THREE.PlaneGeometry(760, 760, 190, 190);
  tg.rotateX(-Math.PI / 2); tg.translate(40, 0, -220);
  const pos = tg.attributes.position, va = new Float32Array(pos.count);
  for (let i = 0; i < pos.count; i++) { const x = pos.getX(i), z = pos.getZ(i); pos.setY(i, terrainH(x, z)); va[i] = volcFactor(x, z); }
  tg.setAttribute('aVolc', new THREE.BufferAttribute(va, 1));
  tg.computeVertexNormals();
  const terrain = new THREE.Mesh(tg, new THREE.ShaderMaterial({
    uniforms: U,
    vertexShader: `attribute float aVolc; varying vec3 vPos; varying vec3 vN; varying float vVolc;
      void main(){ vec4 wp = modelMatrix * vec4(position, 1.0); vPos = wp.xyz; vN = normalize(mat3(modelMatrix) * normal); vVolc = aVolc; gl_Position = projectionMatrix * viewMatrix * wp; }`,
    fragmentShader: `uniform vec3 uSun; uniform vec3 uSunCol; uniform vec3 uAmb; uniform vec3 uFogCol;
      uniform float uMagma; uniform float uVeg; uniform float uIce; uniform float uMature; uniform float uTime; uniform float uW; uniform float uVolc; uniform float uFogD; uniform float uFlash; uniform float uWet;
      varying vec3 vPos; varying vec3 vN; varying float vVolc;
      ${GLSL_NOISE}
      void main(){
        vec3 n = normalize(vN);
        float slope = 1.0 - n.y;
        float hw = vPos.y - uW;
        float nn = fbm4(vPos.xz * 0.07);

function placeTrees(S, W, veg) {

  // darken the top and bottom edges so the text stays readable against a bright sky
  {
    octx.save(); octx.scale(dpr, dpr); octx.globalAlpha = alpha;
    const g = octx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, 'rgba(4,6,12,0.62)'); g.addColorStop(0.24, 'rgba(4,6,12,0)');
    g.addColorStop(0.8, 'rgba(4,6,12,0)'); g.addColorStop(1, 'rgba(4,6,12,0.55)');
    octx.fillStyle = g; octx.fillRect(0, 0, W, H);
    octx.restore();
  }
  const km = Math.pow(Math.max(0, L.camY - L.gy) / 12, 1.6);
  const x0 = cx - vw / 2 + 4, y1 = cy + vh / 2 - 40, y0 = Math.max(cy - vh / 2 + 56, y1 - 220);
  const yAt = k => lerp(y1, y0, Math.sqrt(clamp(k / 120)));
  octx.save(); octx.scale(dpr, dpr); octx.globalAlpha = alpha;
  octx.strokeStyle = 'rgba(231,234,243,0.5)'; octx.lineWidth = 1;
  octx.beginPath(); octx.moveTo(x0 + 6, y0); octx.lineTo(x0 + 6, y1); octx.stroke();
  octx.font = '500 10px "IBM Plex Mono", monospace'; octx.textAlign = 'left';
  const layers = L.age > 2350 ? [[0, 'YÜZEY'], [12, L.steam > 0.3 ? 'BUHAR BULUTLARI' : 'TROPOSFER'], [60, 'ÜST ATMOSFER · OZON YOK']]
    : [[0, 'YÜZEY'], [12, 'TROPOSFER SINIRI'], [25, 'OZON TABAKASI'], [50, 'STRATOSFER'], [85, 'MEZOSFER']];
  for (const [k, t] of layers) {
    const y = yAt(k);
    octx.fillStyle = 'rgba(231,234,243,0.65)'; octx.fillRect(x0 + 3, y - 0.5, 7, 1);
    octx.fillStyle = 'rgba(231,234,243,0.75)'; octx.fillText(`${k} km  ${t}`, x0 + 14, y + 3);
  }
  const y = yAt(km);
  octx.fillStyle = '#fff'; octx.beginPath(); octx.moveTo(x0 + 6, y); octx.lineTo(x0, y - 5); octx.lineTo(x0, y + 5); octx.fill();
  octx.font = '600 12px "IBM Plex Mono", monospace';
  octx.fillText(km < 0.05 ? 'İRTİFA: YÜZEY' : `İRTİFA: ${km < 10 ? nf1.format(km) : nf0.format(km)} km`, x0 + 14, y0 - 12);
  octx.font = '400 10px "IBM Plex Mono", monospace'; octx.fillStyle = 'rgba(231,234,243,0.6)';
  octx.fillText('SÜRÜKLE: ETRAFINA BAK', x0 + 14, y1 + 18);
  octx.restore();
}

/* ================================================================ camera / view manager */
// Views: 'disk', 'orbit', 'impact' are drawn on the 2D canvas; 'interior' and 'surface' in WebGL.
let manualView = 'auto';
const VIEW = { cur: '2d', next: '2d', k: 1, since: 0 };
const kindOf = v => (v === 'interior' || v === 'surface' ? v : '2d');
function desiredView(T) {
  const i = sceneAt(T), s = SCENES[i];
  let v = s.view(sceneU(T, i));
  if (manualView !== 'auto' && s.manual) v = manualView;
  if ((v === 'surface' || v === 'interior') && !GL) v = 'orbit';
  return v;
}

/* ================================================================ UI */
const $ = id => document.getElementById(id);
const ui = {
  era: $('era'), ageNum: $('ageNum'), ageUnit: $('ageUnit'), since: $('since'),
  chapter: $('chapter'), chapterSpan: $('chapterSpan'), desc: $('desc'), more: $('more'),
  rTemp: $('rTemp'), rPres: $('rPres'), rMass: $('rMass'), rDay: $('rDay'), rMoon: $('rMoon'), rCore: $('rCore'), rAtmo: $('rAtmo'),
  play: $('play'), icoPlay: $('icoPlay'), icoPause: $('icoPause'), restart: $('restart'), speed: $('speed'),
  timeline: $('timeline'), segs: $('segs'), marks: $('marks'), playhead: $('playhead'), toast: $('toast'),
  views: [...document.querySelectorAll('.views button')],
};
const nf0 = new Intl.NumberFormat('tr-TR', { maximumFractionDigits: 0 });
const nf1 = new Intl.NumberFormat('tr-TR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const nf2 = new Intl.NumberFormat('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const nf3 = new Intl.NumberFormat('tr-TR', { minimumFractionDigits: 3, maximumFractionDigits: 3 });

function fmtAge(a) {
  if (a < 0.0005) return ['Bugün', ''];
  if (a < 1) return [nf0.format(a * 1000), 'bin yıl önce'];
  if (a < 1000) return [nf0.format(a), 'milyon yıl önce'];
  return [nf3.format(a / 1000), 'milyar yıl önce'];
}
function fmtSpan(ma) {
  if (ma < 0.001) return nf0.format(ma * 1e6) + ' yıl';
  if (ma < 1) return nf0.format(ma * 1000) + ' bin yıl';
  if (ma < 10) return nf1.format(ma) + ' milyon yıl';
  if (ma < 1000) return nf0.format(ma) + ' milyon yıl';
  return nf2.format(ma / 1000) + ' milyar yıl';
}
function fmtHours(h) {
  if (h < 48) return nf0.format(Math.max(1, h)) + ' saat';
  if (h < 24 * 60) return nf0.format(h / 24) + ' gün';
  if (h < 24 * 730) return nf0.format(h / 730) + ' ay';

}
// hours elapsed since the impact, for the two scenes that hold the age still
function impactHours(T) {
  const t = T - SCENES[SI.theia].t0;
  if (t < IMP_C) return -(IMP_C - t) * 1.6;
  if (t < SCENES[SI.theia].dur) return (t - IMP_C) * 1.8;
  const u = (t - SCENES[SI.theia].dur) / SCENES[SI.moon].dur;
  const h0 = (SCENES[SI.theia].dur - IMP_C) * 1.8;
  return Math.pow(10, lerp(Math.log10(h0), Math.log10(100 * 8766), u));
}

SCENES.forEach(s => {
  const seg = document.createElement('div');
  seg.className = 'seg';
  seg.style.flex = s.dur + ' 1 0';
  seg.innerHTML = `<div class="bar"><div class="fill"></div></div><span class="lbl">${s.short}</span>`;
  ui.segs.appendChild(seg);
  s.el = seg; s.fill = seg.querySelector('.fill');
});
const GAP = 3;
function timeToPx(T) {
  const wpx = ui.timeline.clientWidth - GAP * (SCENES.length - 1);
  return (T / TOTAL) * wpx + sceneAt(T) * GAP;
}
function pxToTime(x) {
  const wpx = ui.timeline.clientWidth - GAP * (SCENES.length - 1);
  let acc = 0;
  for (let k = 0; k < SCENES.length; k++) {
    const sw = (SCENES[k].dur / TOTAL) * wpx;
    if (x <= acc + sw || k === SCENES.length - 1) return clamp(SCENES[k].t0 + clamp((x - acc) / sw) * SCENES[k].dur, 0, TOTAL);
    acc += sw + GAP;
  }

}
function placeMarks() {
  ui.marks.innerHTML = '';
  for (const ev of EVENTS) {
    const m = document.createElement('div');
    m.className = 'mark';
    m.style.left = timeToPx(ev.t) + 'px';
    m.title = ev.text;
    ev.el = m;
    ui.marks.appendChild(m);
  }
}

let T = 0, playing = !reduceMotion, speed = 1, lastScene = -1, toastTimer = 0, jumped = true, cache = {};
function setText(el, key, v) { if (cache[key] !== v) { cache[key] = v; el.textContent = v; } }
const fmtTemp = t => nf0.format(Math.round(t / 5) * 5) + ' °C';
const fmtPres = p => (p >= 10 ? nf0.format(Math.round(p / 10) * 10) : nf1.format(p)) + ' bar';

function readouts(age, i, moonBody) {
  const k = SCENES[i].key;
  const imp = k === 'theia' || k === 'moon';
  const post = imp ? (T - SCENES[SI.theia].t0) - IMP_C : 0;
  const coreKm = r => nf0.format(Math.round(r * 6371 / 10) * 10);
  if (i <= 1) return { t: '−200…1.500 °C', p: '—', m: i === 0 ? '—' : '%' + nf1.format(kf(KF.mass, age)), d: '—', mo: '—', c: '—', a: atmoText(age) };
  if (imp) {
    const pre = post < 0;
    const mpct = pre ? 88 : lerp(88, 99, sstep(0, 3, post));
    return {
      t: pre ? fmtTemp(2000) : fmtTemp(lerp(6000, 2500, sstep(0, 30, post))),
      p: pre ? '—' : 'kaya buharı',
      m: '%' + nf0.format(mpct),
      d: pre ? '—' : '~5 saat',
      mo: moonBody ? (post > 26 ? '~25.000 km' : `%${nf0.format(clamp(moonBody.m / MOON_REF) * 100)} toplandı`) : (pre ? '—' : 'disk'),
      c: pre ? coreKm(kf(KF.coreR, PRE) * 0.93) + ' km' : (post < 8 ? 'Theia çekirdeği karışıyor' : coreKm(0.546) + ' km'),
      a: pre ? 'Kaya buharı, hidrojen' : 'Silikat buharı',
    };
  }
  const R = kf(KF.radius, age), inner = kf(KF.innerR, age);
  return {
    t: fmtTemp(kf(KF.temp, age)),
    p: age < 4511 ? fmtPres(kf(KF.pres, age)) : '—',
    m: '%' + (kf(KF.mass, age) < 10 ? nf1 : nf0).format(kf(KF.mass, age)),
    d: age < 4511 ? nf1.format(kf(KF.day, age)) + ' saat' : '—',
    mo: age < 4511 ? nf0.format(Math.round(kf(KF.moonKm, age) / 100) * 100) + ' km' : '—',
    c: coreKm(kf(KF.coreR, age) * R) + (inner > 0.005 ? ' / ' + coreKm(inner) : '') + ' km',
    a: atmoText(age),
  };
}

function updateViewButtons(i) {
  const s = SCENES[i];
  for (const b of ui.views) {
    const v = b.dataset.view;
    const allowed = v === 'auto' || (s.manual && (v === 'orbit' || GL));
    b.disabled = !allowed;
    b.title = allowed ? '' : (s.manual ? '3D görünüm bu tarayıcıda kullanılamıyor' : 'Bu bölümde kamera otomatik');
    b.setAttribute('aria-pressed', String(v === manualView));
    b.classList.toggle('auto-on', v === 'auto' && manualView === 'auto');
  }
}

function updateUI(age, moonBody) {
  const i = sceneAt(T), s = SCENES[i];
  if (i !== lastScene) {
    lastScene = i;
    document.documentElement.style.setProperty('--era', s.color);
    ui.era.textContent = s.name;
    ui.desc.textContent = s.text;
    ui.chapter.textContent = `Bölüm ${i + 1} / ${SCENES.length}`;
    ui.chapterSpan.textContent = s.a0 === s.a1 || s.key === 'moon' ? 'Saatler – yüzyıllar' : s.a1 === 0 ? `${nf0.format(s.a0)} My – bugün` : `${nf0.format(s.a0)}–${nf0.format(s.a1)} My`;
    SCENES.forEach((x, k) => x.el.classList.toggle('on', k === i));
    updateViewButtons(i);
  }
  const [num, unit] = fmtAge(age);
  setText(ui.ageNum, 'an', num); setText(ui.ageUnit, 'au', unit);
  if (s.key === 'theia' || s.key === 'moon') {
    const h = impactHours(T);
    setText(ui.since, 'si', h < 0 ? 'Çarpışmaya kalan: ' + fmtHours(-h) : 'Çarpışmadan bu yana: ' + fmtHours(h));
  } else setText(ui.since, 'si', 'Güneş Sistemi\'nin yaşı: ' + fmtSpan(SCENES[0].a0 - age));
  const R = readouts(age, i, moonBody);
  setText(ui.rTemp, 'rt', R.t); setText(ui.rPres, 'rp', R.p); setText(ui.rMass, 'rm', R.m);
  setText(ui.rDay, 'rd', R.d); setText(ui.rMoon, 'rmo', R.mo); setText(ui.rCore, 'rc', R.c); setText(ui.rAtmo, 'ra', R.a);
  for (let k = 0; k < SCENES.length; k++) {
    const w = (clamp((T - SCENES[k].t0) / SCENES[k].dur) * 100).toFixed(2) + '%';
    if (cache['f' + k] !== w) { cache['f' + k] = w; SCENES[k].fill.style.width = w; }
  }
  ui.playhead.style.left = timeToPx(T) + 'px';
  ui.timeline.setAttribute('aria-valuenow', Math.round(T / TOTAL * 100));
  ui.timeline.setAttribute('aria-valuetext', s.name + ', ' + num + ' ' + unit);
  for (const ev of EVENTS) if (ev.el) ev.el.classList.toggle('past', ev.t <= T);
}

function showToast(ev) {
  ui.toast.innerHTML = '';
  const i = document.createElement('i');
  if (ev.tag) i.textContent = ev.tag;
  else { const [n, u] = fmtAge(ev.age); i.textContent = n + ' ' + u.replace(' önce', ''); }
  ui.toast.append(i, document.createTextNode(ev.text));
  ui.toast.hidden = false;
  ui.toast.style.animation = 'none'; void ui.toast.offsetWidth; ui.toast.style.animation = '';
  toastTimer = 4.2;
}

function setPlaying(p) {
  playing = p;
  ui.icoPlay.hidden = p; ui.icoPause.hidden = !p;
  ui.play.setAttribute('aria-label', p ? 'Duraklat' : 'Oynat');
}
function seek(t) {
  T = clamp(t, 0, TOTAL);
  impacts.length = 0;
  ui.toast.hidden = true;
  jumped = true;
}

ui.play.addEventListener('click', () => {
  if (!playing && T >= TOTAL) seek(0);
  setPlaying(!playing);
});
ui.restart.addEventListener('click', () => { seek(0); setPlaying(true); });
const SPEEDS = [0.5, 1, 2, 4];
function setSpeed(s) {
  speed = s;
  const label = (s === 0.5 ? '0,5' : String(s)) + '×';
  ui.speed.textContent = label;
  ui.speed.setAttribute('aria-label', 'Simülasyon hızı: ' + label);
}
ui.speed.addEventListener('click', () => setSpeed(SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length]));
for (const b of ui.views) b.addEventListener('click', () => {
  manualView = b.dataset.view;
  updateViewButtons(sceneAt(T));
});
ui.more.addEventListener('click', () => {
  const open = ui.desc.classList.toggle('open');
  ui.more.textContent = open ? 'Daha az göster' : 'Devamını oku';
  ui.more.setAttribute('aria-expanded', String(open));
});
{
  let drag = false;
  const at = e => { const r = ui.timeline.getBoundingClientRect(); seek(pxToTime(e.clientX - r.left)); };
  ui.timeline.addEventListener('pointerdown', e => { drag = true; ui.timeline.setPointerCapture(e.pointerId); at(e); });
  ui.timeline.addEventListener('pointermove', e => { if (drag) at(e); });
  const end = () => { drag = false; };
  ui.timeline.addEventListener('pointerup', end);
  ui.timeline.addEventListener('pointercancel', end);
  ui.timeline.addEventListener('keydown', e => {
    const step = e.shiftKey ? 8 : 2;
    if (e.key === 'ArrowRight') { seek(T + step); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { seek(T - step); e.preventDefault(); }
    else if (e.key === 'Home') { seek(0); e.preventDefault(); }
    else if (e.key === 'End') { seek(TOTAL); e.preventDefault(); }
    else if (e.key === 'PageDown') { seek(SCENES[Math.min(SCENES.length - 1, sceneAt(T) + 1)].t0); e.preventDefault(); }
    else if (e.key === 'PageUp') { seek(SCENES[Math.max(0, sceneAt(T) - 1)].t0); e.preventDefault(); }
  });
}
document.addEventListener('keydown', e => {
  if (e.key === ' ' && !(e.target instanceof HTMLButtonElement)) { e.preventDefault(); ui.play.click(); }
});
// drag to look around in the 3D views
{
  let d = null;
  glCv.addEventListener('pointerdown', e => {
    if (!GL) return;
    d = { x: e.clientX, y: e.clientY, iy: GL.iYaw, ip: GL.iPitch, sy: GL.sYaw, sp: GL.sPitch };
    glCv.setPointerCapture(e.pointerId);
  });
  glCv.addEventListener('pointermove', e => {
    if (!d) return;
    const dx = (e.clientX - d.x) * 0.005, dy = (e.clientY - d.y) * 0.005;
    GL.iYaw = clamp(d.iy - dx, -0.65, 0.65); GL.iPitch = clamp(d.ip + dy, -0.35, 0.6);
    GL.sYaw = d.sy + dx; GL.sPitch = clamp(d.sp + dy, -0.5, 0.9);
  });
  const end = () => { d = null; };
  glCv.addEventListener('pointerup', end);
  glCv.addEventListener('pointercancel', end);
}

/* ================================================================ main loop */
let lastNow = performance.now(), glOpacity = -1, glOn = false;
function frame(now) {
  const dt = Math.min(0.05, (now - lastNow) / 1000);
  lastNow = now;
  const prevT = T;
  if (playing) {
    T = Math.min(TOTAL, T + dt * speed);
    if (T >= TOTAL) setPlaying(false);
  }
  clock += dt;
  const age = ageAt(T), i = sceneAt(T), u = sceneU(T, i), key = SCENES[i].key;

  // planet spin follows the length of the day: a young Earth spun much faster
  const day = age < 4511 ? kf(KF.day, age) : 7;
  const slow = reduceMotion ? 0.3 : 1;
  spin += dt * 0.28 * (24 / day) * slow;
  cspin += dt * 0.28 * (24 / day) * 0.93 * slow;
  if (age < 4511 && key !== 'moon') {
    const dN = clamp((kf(KF.moonKm, age) - 25000) / (384400 - 25000));
    const dist = lerp(Rfull * 1.75, moonMax, Math.pow(dN, 0.8));
    moonAng += dt * Math.min(1.4, 0.25 * Math.pow(moonMax / dist, 1.5)) * slow;
  }

  // view transitions: fade the current view out while zooming in, then fade the next one in
  const want = kindOf(desiredView(T));
  if (want !== VIEW.next) {
    if (jumped) { VIEW.cur = VIEW.next = want; VIEW.k = 1; VIEW.since = 0; }
    else { VIEW.cur = VIEW.k < 0.5 ? VIEW.cur : VIEW.next; VIEW.next = want; VIEW.k = 0; }
  }
  const wasFirstHalf = VIEW.k < 0.5;
  VIEW.k = Math.min(1, VIEW.k + dt / (reduceMotion ? 0.6 : 1.5));
  if (wasFirstHalf && VIEW.k >= 0.5) VIEW.since = 0;
  VIEW.since += dt;
  const shown = VIEW.k < 0.5 ? VIEW.cur : VIEW.next;
  const vAlpha = VIEW.cur === VIEW.next ? 1 : (VIEW.k < 0.5 ? 1 - VIEW.k * 2 : VIEW.k * 2 - 1);
  const zoomIn = VIEW.cur === VIEW.next ? 0 : (VIEW.k < 0.5 ? VIEW.k * 2 : 1 - (VIEW.k * 2 - 1));
  const zoomMul = 1 + 2.4 * zoomIn * zoomIn;

  // events crossed while playing
  if (playing && T > prevT) {
    for (const ev of EVENTS) {
      if (prevT < ev.t && ev.t <= T) {
        showToast(ev);
        if (ev.impact) {
          spawnImpact(true);
          if (GL) GL.meteors.push({ t: 0, dur: 1.4, a: 0.35, e: 0.55, big: true });
        }
      }
    }
    if (i >= 2 && shown === '2d') {
      const n = impactRate(age, i, u) * dt * speed;
      if (Math.random() < n) spawnImpact(false);
    }
  }
  if (toastTimer > 0) { toastTimer -= dt; if (toastTimer <= 0) ui.toast.hidden = true; }

  // 2D canvas
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  octx.setTransform(1, 0, 0, 1, 0, 0);
  octx.clearRect(0, 0, ovl.width, ovl.height);
  let moonBody = null;
  if (!(shown === 'surface' && vAlpha > 0.99)) ctx.drawImage(starCv, 0, 0);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (shown === '2d') {
    if (i <= 2) {
      // the disk view zooms onto the proto-Earth during the first third of scene 3
      const diskA = i < 2 ? 1 : 1 - sstep(0.18, 0.32, u);
      if (i >= 1 && diskA > 0) nbSync(T);
      if (diskA > 0) drawDiskView(T, diskA * vAlpha);
      if (i === 2) drawPlanetScene(T, age, sstep(0.13, 0.3, u) * vAlpha, dt, zoomMul);
    } else if (key === 'theia' || key === 'moon') {
      moonBody = drawImpact(T, vAlpha, dt, zoomMul);
    } else {
      drawPlanetScene(T, age, vAlpha, dt, zoomMul);
    }
  }
  if ((key === 'theia' || key === 'moon') && !moonBody) { impSync(T - SCENES[SI.theia].t0); moonBody = impMoon(); }

  // WebGL views
  const show3d = shown !== '2d' && GL;
  if (show3d) {
    const P = planetParams(age, T);
    if (shown === 'interior') { renderInterior(GL, age, P, VIEW.since, dt); drawInteriorLabels(GL, vAlpha); }
    else { renderSurface(GL, age, P, VIEW.since, dt); drawSurfaceHUD(GL, vAlpha); }
  }
  const op = show3d ? vAlpha : 0;
  if (Math.abs(op - glOpacity) > 0.004) { glOpacity = op; glCv.style.opacity = op.toFixed(3); }
  const on = show3d && vAlpha > 0.5;
  if (on !== glOn) { glOn = on; document.body.classList.toggle('gl-on', on); }

  jumped = false;
  updateUI(age, moonBody);
  requestAnimationFrame(frame);
}

function start(data) {
  buildTextures();
  GL = initGL();
  layout();
  placeMarks();
  if (data && typeof data.T === 'number') seek(data.T);
  if (data && typeof data.speed === 'number') setSpeed(data.speed);
  if (data && typeof data.view === 'string') manualView = data.view;
  setPlaying(playing);
  updateViewButtons(sceneAt(T));
  let rt = 0;
  const onResize = () => { clearTimeout(rt); rt = setTimeout(() => { layout(); placeMarks(); }, 120); };
  window.addEventListener('resize', onResize);
  if (window.ResizeObserver) new ResizeObserver(onResize).observe(stageEl);
  requestAnimationFrame(t => { lastNow = t; frame(t); });
}

const hot = window.claude && window.claude.hot;
if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ T, speed, view: manualView }));
if (hot && typeof hot.ready === 'function') hot.ready(start);
else start((hot && hot.data) || {});
})();
</script>
